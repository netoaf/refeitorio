name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build API
        run: |
          dotnet restore Refeitorio_API/Refeitorio_API.sln
          dotnet build Refeitorio_API/Refeitorio_API.sln --configuration Release --no-restore
      - name: Restore and build MVC
        run: |
          dotnet restore refeitorio/refeitorio.sln
          dotnet build refeitorio/refeitorio.sln --configuration Release --no-restore
      - name: Test API
        run: dotnet test Refeitorio_API/Refeitorio_API.sln --configuration Release --no-build
